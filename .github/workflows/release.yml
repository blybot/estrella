name: Release

# Every push to main is checked. If the commits since the last release include
# conventional-commit types that warrant a release (feat → minor, fix/perf/... →
# patch, `!`/BREAKING CHANGE → major), the image and Helm chart are published,
# then the commit is tagged vX.Y.Z and a GitHub release is created.
on:
  push:
    branches: [main]
  # Re-run the release decision for main by hand (e.g. after a failed run).
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/estrella
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/helm

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    name: Decide version
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version from conventional commits
        id: next
        run: |
          version="$(scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-worthy commits since the last release" >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version
        run: scripts/stamp-version.sh "${{ needs.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    name: Image manifest
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:${VERSION%.*}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  chart:
    name: Helm chart
    # After the images, so a published chart never points at a missing image.
    needs: [version, image-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm/estrella --version "$VERSION" --app-version "$VERSION" -d packaged
          helm push "packaged/estrella-$VERSION.tgz" "$CHART_REPO"

  release:
    name: Tag and GitHub release
    needs: [version, image-manifest, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
