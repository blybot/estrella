name: Check

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, test & e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build flake package
        run: nix build .#default

      - name: Build frontend
        run: nix develop --command bash -c "cd frontend && npm ci && npm run build"

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: Run tests
        run: nix develop --command cargo test

      - name: Run e2e tests
        run: nix develop --command bash -c "cd frontend && npx playwright test"

  helm:
    name: Helm chart and release scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint and render chart
        run: scripts/test-helm-chart.sh

      - name: Test release versioning
        run: scripts/test-next-version.sh

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: estrella:check
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max

      - name: Smoke test image
        run: scripts/smoke-test-image.sh estrella:check
