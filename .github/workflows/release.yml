name: Release

# Every push to main is checked. If the commits since the last release include
# conventional-commit types that warrant a release (feat → minor, fix/perf/... →
# patch, `!`/BREAKING CHANGE → major), the image, Helm chart and .deb are
# published, then the commit is tagged vX.Y.Z and a GitHub release is created.
on:
  push:
    branches: [main]
  # Re-run the release decision for main by hand (e.g. after a failed run).
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/estrella
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/helm

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    name: Decide version
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version from conventional commits
        id: next
        run: |
          version="$(scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-worthy commits since the last release" >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version
        run: scripts/stamp-version.sh "${{ needs.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    name: Image manifest
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:${VERSION%.*}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  chart:
    name: Helm chart
    # After the images, so a published chart never points at a missing image.
    needs: [version, image-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm/estrella --version "$VERSION" --app-version "$VERSION" -d packaged
          helm push "packaged/estrella-$VERSION.tgz" "$CHART_REPO"

  build-deb:
    name: Build .deb (arm64)
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version
        run: scripts/stamp-version.sh "$VERSION"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build static binary
        run: nix build .#static -o result

      - name: Verify binary is static
        run: |
          file result/bin/estrella
          ldd result/bin/estrella 2>&1 && exit 1 || echo "Binary is statically linked"

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.41.1
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_arm64.deb" -o nfpm.deb
          sudo dpkg -i nfpm.deb

      - name: Build .deb package
        run: nfpm package --packager deb --target "estrella_${VERSION}_arm64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: estrella_${{ env.VERSION }}_arm64.deb

  release:
    name: Tag and GitHub release
    needs: [version, image-manifest, chart, build-deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-package

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: estrella_${{ needs.version.outputs.version }}_arm64.deb
          generate_release_notes: true

  publish-apt:
    name: Publish apt repository
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Skip without a signing key
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "::notice::GPG_PRIVATE_KEY isn't set; skipping the apt repository (see docs/releasing.md)"

      - name: Download .deb artifact
        if: env.GPG_PRIVATE_KEY != ''
        uses: actions/download-artifact@v8
        with:
          name: deb-package

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Create apt release if it doesn't exist
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apt --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create apt \
              --repo "${{ github.repository }}" \
              --title "APT Repository" \
              --notes "Flat apt repository for Raspberry Pi. See README for install instructions." \
              --latest=false

      - name: Upload new .deb to apt release
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apt \
            "estrella_${VERSION}_arm64.deb" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Build apt repository metadata
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo && cd repo

          # Download all .deb files from the apt release to rebuild Packages from scratch
          gh release download apt \
            --repo "${{ github.repository }}" \
            --pattern '*.deb' \
            --dir . 2>/dev/null || true

          # Also include the newly built .deb (overwrites if same version)
          cp "../estrella_${VERSION}_arm64.deb" .

          # Generate Packages from all .debs
          dpkg-scanpackages --multiversion . > Packages
          sed -i 's|Filename: \./|Filename: |' Packages
          rm -f ./*.deb
          gzip -k -f Packages

          # Generate Release file
          apt-ftparchive release . > Release

          # Sign Release
          gpg --batch --yes --default-key "${{ secrets.GPG_KEY_ID }}" \
            -abs -o Release.gpg Release
          gpg --batch --yes --default-key "${{ secrets.GPG_KEY_ID }}" \
            --clearsign -o InRelease Release

          # Export public key
          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" > gpg.key

      - name: Upload apt metadata to release
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apt \
            repo/Packages repo/Packages.gz \
            repo/Release repo/Release.gpg repo/InRelease \
            repo/gpg.key \
            --repo "${{ github.repository }}" \
            --clobber
